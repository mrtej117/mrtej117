name: Generate GitArtWork

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jasineri/gitartwork@v1
        with:
          user_name: mrtej117
          text: SAI TEJ
          svg_file_name: sai-tej-artwork.svg
      - name: Remove GitArtWork attribution
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("sai-tej-artwork.svg")
          svg = path.read_text()
          svg = re.sub(
              r"<(?:a|text)[^>]*>.*?Get your own gitartwork.*?</(?:a|text)>",
              "",
              svg,
              flags=re.IGNORECASE | re.DOTALL,
          )
          path.write_text(svg)
          PY
      - uses: jasineri/simple-push-action@v1
